[versions]
agp = "9.3.3"
android-compileSdk = "37"
android-minSdk = "23"
# The Android sample's floor: Compose 1.12, material3 1.5 and Navigation 3 1.2 need API 24, one above
# the library's.
android-sample-minSdk = "24"
android-targetSdk = "37"
# The Android sample (samples/android) only; nothing published depends on these. Material 3
# Expressive exists only in the 1.5.0 alpha line, so material3 is pinned over the Compose BOM.
androidx-activity = "1.13.0"
androidx-compose-bom = "2026.09.00"
androidx-compose-material3 = "1.5.0-alpha29"
androidx-compose-material3-adaptive = "1.3.0"
androidx-core = "1.19.1"
androidx-exifinterface = "1.4.2"
androidx-lifecycle = "2.11.0"
androidx-navigation3 = "1.2.0"
# The version navigation3-ui resolves today; the sample reads its back-gesture state directly.
androidx-navigationevent = "1.1.1"
# The library's Android artifact: records the application context at startup.
androidx-startup = "1.2.0"
androidx-test-core = "1.7.0"
androidx-testExt = "1.3.0"
# Build-tool floors: patched minimum versions of libraries that the Gradle plugins and their tools
# put on the build's own classpaths. Nothing here ships. Each is applied as a dependency constraint,
# which only ever raises a version (CONTRIBUTING.md, "Security alerts"), and
# scripts/check-build-tool-floors.py proves it holds. Remove a floor once the plugin release named
# beside it brings the patched version; the check fails when no plugin needs it any more.
#
# GHSA-9pwp-9qqc-pr26, GHSA-qp49-qgx5-5m26, GHSA-574f-3g2m-x479, GHSA-c3fc-8qff-9hwx (bcprov) and
# GHSA-wg6q-6289-32hp (bcpkix): the Android Gradle plugin, its lint and its test platform's result
# listener bring 1.79 (9.3.3) or 1.80.2 (9.4.1, 9.5.0-alpha07), and the Kotlin Gradle plugin's
# publishing validation, which signing enables, 1.84 (2.4.20). Unneeded once an Android Gradle
# plugin release brings 1.85 and a Kotlin one 1.85. bcutil needs no floor: bcpkix brings its own
# version of it.
buildToolFloor-bouncycastle = "1.86"
# GHSA-j288-q9x7-2f5v: the Android Gradle plugin, its lint and its test platform's result listener
# bring 3.16.0 through commons-compress 1.27.1. Unneeded once an Android Gradle plugin release uses
# commons-compress 1.28.0.
buildToolFloor-commons-lang3 = "3.18.0"
# GHSA-27j2-h3m2-8237: Kover's HTML reporter (coverage-report 1.0.25) and Dokka's generator (2.2.0)
# bring 2.3.32. Unneeded once a Kover release and a Dokka release bring 2.3.35.
buildToolFloor-freemarker = "2.3.35"
# GHSA-7r82-7xv7-xcpj: the Android Gradle plugin's lint and its test platform's result listener
# bring 4.5.6 through httpmime 4.5.6. Unneeded once an Android Gradle plugin release drops that
# httpmime.
buildToolFloor-httpclient = "4.5.14"
# GHSA-72hv-8253-57qq and GHSA-r7wm-3cxj-wff9 (jackson-core, patched in 2.18.8), GHSA-3pjw-73gf-8qr5,
# GHSA-5jmj-h7xm-6q6v, GHSA-cxp5-3px4-pw24, GHSA-gx83-3vf8-gh7j, GHSA-hgj6-7826-r7m5,
# GHSA-j3rv-43j4-c7qm, GHSA-q4xh-88c3-wmh7, GHSA-rmj7-2vxq-3g9f, GHSA-vvgp-rfg2-7rr6,
# GHSA-wjgm-6hv5-3cvf and GHSA-wv8q-qhhj-9h54 (jackson-databind, 2.18.11): Dokka's Gradle plugin and
# generator (2.2.0) bring 2.15.3. Floored through the two Jackson modules Dokka asks for, whose
# Jackson BOM moves jackson-core and jackson-databind with them. Unneeded once a Dokka release brings
# 2.18.11.
buildToolFloor-jackson = "2.18.11"
# GHSA-2363-cqg2-863c: the Android Gradle plugin brings 2.0.6 through Jetifier 1.0.0-beta10, its
# final release. Unneeded once an Android Gradle plugin release drops Jetifier.
buildToolFloor-jdom2 = "2.0.6.1"
# GHSA-3677-xxcr-wjqv: the Android Gradle plugin brings 0.9.5 through bundletool 1.18.3. Unneeded
# once an Android Gradle plugin release uses a bundletool that brings 0.9.6.
buildToolFloor-jose4j = "0.9.7"
# GHSA-pmhh-3w7g-xqp8: Dokka's generator (2.2.0) brings 1.16.1. Unneeded once a Dokka release brings
# 1.23.1.
buildToolFloor-jsoup = "1.23.2"
# 40 advisories on netty-handler, -handler-proxy, -codec, -codec-http, -codec-http2 and -common,
# the latest patched in 4.1.137.Final (GHSA-c4c3-7fpv-j4q5, GHSA-fccg-mwvh-qqg4,
# GHSA-8c42-7qj2-3j46): the Android Gradle plugin's unified test platform brings 4.1.93.Final (its
# core, through grpc-netty 1.57.2) and 4.1.110.Final (its emulator-control plugin 32.3.3, through
# grpc-netty 1.69.1). grpc-netty asks for netty-codec-http2 and netty-handler-proxy alone; their
# 4.1.137.Final releases bring every other Netty artifact at the same version, so those two are the
# floors. Unneeded once an Android Gradle plugin release's test platform brings 4.1.137.Final.
buildToolFloor-netty = "4.1.137.Final"
# GHSA-rcgg-9c38-7xpx: the Kotlin Gradle plugin's Swift export brings 1.41.0 (2.4.20, 2.5.0-Beta1).
# Unneeded once a Kotlin release's Swift export brings 1.62.0.
buildToolFloor-opentelemetry = "1.62.0"
# The Android sample's image loader.
coil = "3.6.3"
# The documentation engine: the HTML reference in each published artifact's documentation jar.
dokka = "2.2.0"
junit = "4.13.2"
kotlin = "2.4.21"
# Held with supabase-bom, as Ktor is: the version the pinned supabase-kt release was built with.
kotlinx-coroutines = "1.10.2"
kotlinx-serialization = "1.11.0"
kover = "0.9.11"
ksp = "2.3.12"
# The formatter kempt runs (.kempt.toml reads this key). CI pins the jar by checksum: see
# CONTRIBUTING.md, "Formatting", before changing it.
ktfmt = "0.64"
# Held with supabase-bom: the version the pinned supabase-kt release was built with.
ktor = "3.4.3"
# The Maven Central publishing plugin (com.vanniktech.maven.publish). It needs Gradle 9.0 or later.
mavenPublish = "0.37.0"
okio = "3.17.0"
robolectric = "4.17"
# The Android framework jar Robolectric 4.17 loads for `sdk=35`, named by the exact build its
# release picks (org.robolectric:android-all-instrumented). The build resolves it so no test
# downloads it (supabase-offline.host-test-robolectric in build-logic). It moves with Robolectric,
# by hand: Dependabot proposes nothing for it. A Robolectric update that wants another build fails
# its host tests with "Unable to locate dependency" and the file name to put here.
robolectric-androidAll = "15-robolectric-13954326-i7"
room = "2.8.5"
sqlite = "2.6.2"
# The system-SQLite iOS test variant only. androidx.sqlite 2.6.x cannot open a connection on the
# iOS libsqlite3 (fixed in 2.7.0-alpha02); every published artifact stays on "sqlite".
sqlite-system = "2.7.1"
# 3.6, not 3.8: supabase-kt 3.7.0 and 3.8.0 carry an uncaught Realtime heartbeat crash and a protocol
# V2 leave defect, fixed upstream but not yet released. Move to the first release with both fixes;
# supabase-offline-kt/build.gradle.kts adds the tests that need 3.8 API from that minor on.
supabase-bom = "3.6.0"
# The library as the samples take it: its newest release on Maven Central, never the version this
# build makes. The post-release pull request moves it (RELEASING.md); the Android sample builds
# this checkout instead with -PsupabaseOffline.local=true (settings.gradle.kts).
supabase-offline = "0.2.0"

[libraries]
# The `gradleApi` and `gradlePlugin` entries are the plugins build-logic compiles against; the
# modules apply the same plugins through [plugins].
android-gradleApi = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
# The Android sample's libraries. The Compose BOM sets every androidx.compose version that has no
# version here.
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-compose-material3" }
androidx-compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "androidx-compose-material3-adaptive" }
androidx-compose-material3-adaptive-navigation3 = { module = "androidx.compose.material3.adaptive:adaptive-navigation3", version.ref = "androidx-compose-material3-adaptive" }
androidx-compose-material3-navigationSuite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite", version.ref = "androidx-compose-material3" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidx-exifinterface" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidx-navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }
androidx-navigationevent-compose = { module = "androidx.navigationevent:navigationevent-compose", version.ref = "androidx-navigationevent" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-gradlePlugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
androidx-sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite" }
androidx-sqlite-framework-system = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite-system" }
androidx-sqlite-system = { module = "androidx.sqlite:sqlite", version.ref = "sqlite-system" }
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "androidx-startup" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidx-test-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
# The build-tool floors (see [versions]). Never a dependency of anything: each is a constraint on
# the build's tool classpaths only, and a new one needs the `buildToolFloor-` prefix to be applied.
buildToolFloor-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "buildToolFloor-bouncycastle" }
buildToolFloor-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "buildToolFloor-bouncycastle" }
buildToolFloor-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "buildToolFloor-commons-lang3" }
buildToolFloor-freemarker = { module = "org.freemarker:freemarker", version.ref = "buildToolFloor-freemarker" }
buildToolFloor-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "buildToolFloor-httpclient" }
buildToolFloor-jackson-dataformat-xml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-xml", version.ref = "buildToolFloor-jackson" }
buildToolFloor-jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "buildToolFloor-jackson" }
buildToolFloor-jdom2 = { module = "org.jdom:jdom2", version.ref = "buildToolFloor-jdom2" }
buildToolFloor-jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "buildToolFloor-jose4j" }
buildToolFloor-jsoup = { module = "org.jsoup:jsoup", version.ref = "buildToolFloor-jsoup" }
buildToolFloor-netty-codec-http2 = { module = "io.netty:netty-codec-http2", version.ref = "buildToolFloor-netty" }
buildToolFloor-netty-handler-proxy = { module = "io.netty:netty-handler-proxy", version.ref = "buildToolFloor-netty" }
buildToolFloor-opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "buildToolFloor-opentelemetry" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
dokka-gradlePlugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
# kotlin.test on JUnit 4, for the Android sample's host tests (an application module gets no
# test-framework variant chosen for it).
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kover-gradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
# Never used by the build: it is here so Dependabot proposes ktfmt updates.
ktfmt = { module = "com.facebook:ktfmt", version.ref = "ktfmt" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
# The Swift bridge's HTTP engine (supabase-offline-swift-bridge); nothing published depends on it.
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
mavenPublish-gradlePlugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
# Robolectric's framework jar for the host tests (supabase-offline.host-test-robolectric).
robolectric-android-all-instrumented = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-androidAll" }
supabase-auth-kt = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase-bom" }
# The published library and its testing artifact, for the Android sample only; the library's alias
# is the one the setup page gives an app.
supabase-offline = { module = "io.github.nesfeder.supabase-offline:supabase-offline-kt", version.ref = "supabase-offline" }
supabase-offline-testing = { module = "io.github.nesfeder.supabase-offline:supabase-offline-kt-testing", version.ref = "supabase-offline" }
supabase-postgrest-kt = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
# The library's channel for the tables its configuration names, and the Android sample's Live
# updates.
supabase-realtime-kt = { module = "io.github.jan-tennert.supabase:realtime-kt" }
supabase-storage-kt = { module = "io.github.jan-tennert.supabase:storage-kt" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
