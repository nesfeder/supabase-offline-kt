[versions]
agp = "9.3.3"
android-compileSdk = "37"
android-minSdk = "23"
androidx-test-core = "1.7.0"
androidx-testExt = "1.3.0"
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kover = "0.9.10"
ksp = "2.3.11"
# The formatter kempt runs (.kempt.toml reads this key). CI pins the jar by checksum: see
# CONTRIBUTING.md, "Formatting", before changing it.
ktfmt = "0.64"
ktor = "3.5.1"
okio = "3.17.0"
robolectric = "4.17"
room = "2.8.4"
skie = "0.10.15"
sqlite = "2.6.2"
# The system-SQLite iOS test variant only. androidx.sqlite 2.6.x cannot open a connection on the
# iOS libsqlite3 (fixed in 2.7.0-alpha02); every published artifact stays on "sqlite".
sqlite-system = "2.7.1"
supabase-bom = "3.8.0"

[libraries]
# The `gradleApi` and `gradlePlugin` entries are the plugins build-logic compiles against; the
# modules apply the same plugins through [plugins].
android-gradleApi = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-gradlePlugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
androidx-sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite" }
androidx-sqlite-framework-system = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite-system" }
androidx-sqlite-system = { module = "androidx.sqlite:sqlite", version.ref = "sqlite-system" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidx-test-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# Never used by the build: it is here so Dependabot proposes ktfmt updates.
ktfmt = { module = "com.facebook:ktfmt", version.ref = "ktfmt" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
supabase-auth-kt = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase-bom" }
supabase-postgrest-kt = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabase-storage-kt = { module = "io.github.jan-tennert.supabase:storage-kt" }

[plugins]
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
