[versions]
agp = "9.3.3"
android-compileSdk = "37"
android-minSdk = "23"
androidx-test-core = "1.7.0"
androidx-testExt = "1.3.0"
# Build-tool floors: patched minimum versions of libraries that the Gradle plugins and their tools
# put on the build's own classpaths. Nothing here ships. Each is applied as a dependency constraint,
# which only ever raises a version (CONTRIBUTING.md, "Security alerts"), and
# scripts/check-build-tool-floors.py proves it holds. Remove a floor once the plugin release named
# beside it brings the patched version; the check fails when no plugin needs it any more.
#
# GHSA-9pwp-9qqc-pr26, GHSA-qp49-qgx5-5m26, GHSA-574f-3g2m-x479, GHSA-c3fc-8qff-9hwx (bcprov) and
# GHSA-wg6q-6289-32hp (bcpkix): the Android Gradle plugin and its lint bring 1.79 (9.3.3) or 1.80.2
# (9.4.1, 9.5.0-alpha07). Unneeded once an Android Gradle plugin release brings 1.85. bcutil needs
# no floor: bcpkix brings its own version of it.
buildToolFloor-bouncycastle = "1.86"
# GHSA-j288-q9x7-2f5v: the Android Gradle plugin and its lint bring 3.16.0 through commons-compress
# 1.27.1. Unneeded once an Android Gradle plugin release uses commons-compress 1.28.0.
buildToolFloor-commons-lang3 = "3.18.0"
# GHSA-27j2-h3m2-8237: Kover's HTML reporter (coverage-report 1.0.25) brings 2.3.32. Unneeded once
# a Kover release brings 2.3.35.
buildToolFloor-freemarker = "2.3.35"
# GHSA-7r82-7xv7-xcpj: the Android Gradle plugin's lint brings 4.5.6 through httpmime 4.5.6.
# Unneeded once a lint release drops that httpmime.
buildToolFloor-httpclient = "4.5.14"
# GHSA-2363-cqg2-863c: the Android Gradle plugin brings 2.0.6 through Jetifier 1.0.0-beta10, its
# final release. Unneeded once an Android Gradle plugin release drops Jetifier.
buildToolFloor-jdom2 = "2.0.6.1"
# GHSA-3677-xxcr-wjqv: the Android Gradle plugin brings 0.9.5 through bundletool 1.18.3. Unneeded
# once an Android Gradle plugin release uses a bundletool that brings 0.9.6.
buildToolFloor-jose4j = "0.9.7"
# GHSA-rcgg-9c38-7xpx: the Kotlin Gradle plugin's Swift export brings 1.41.0 (2.4.20, 2.5.0-Beta1).
# Unneeded once a Kotlin release's Swift export brings 1.62.0.
buildToolFloor-opentelemetry = "1.62.0"
# The documentation engine: the HTML reference in each published artifact's documentation jar.
dokka = "2.2.0"
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kover = "0.9.11"
ksp = "2.3.12"
# The formatter kempt runs (.kempt.toml reads this key). CI pins the jar by checksum: see
# CONTRIBUTING.md, "Formatting", before changing it.
ktfmt = "0.64"
ktor = "3.5.1"
# The Maven Central publishing plugin (com.vanniktech.maven.publish). It needs Gradle 9.0 or later.
mavenPublish = "0.37.0"
okio = "3.17.0"
robolectric = "4.17"
room = "2.8.4"
skie = "0.10.15"
sqlite = "2.6.2"
# The system-SQLite iOS test variant only. androidx.sqlite 2.6.x cannot open a connection on the
# iOS libsqlite3 (fixed in 2.7.0-alpha02); every published artifact stays on "sqlite".
sqlite-system = "2.7.1"
supabase-bom = "3.8.0"

[libraries]
# The `gradleApi` and `gradlePlugin` entries are the plugins build-logic compiles against; the
# modules apply the same plugins through [plugins].
android-gradleApi = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-gradlePlugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
androidx-sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite" }
androidx-sqlite-framework-system = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite-system" }
androidx-sqlite-system = { module = "androidx.sqlite:sqlite", version.ref = "sqlite-system" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidx-test-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
# The build-tool floors (see [versions]). Never a dependency of anything: each is a constraint on
# the build's tool classpaths only, and a new one needs the `buildToolFloor-` prefix to be applied.
buildToolFloor-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "buildToolFloor-bouncycastle" }
buildToolFloor-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "buildToolFloor-bouncycastle" }
buildToolFloor-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "buildToolFloor-commons-lang3" }
buildToolFloor-freemarker = { module = "org.freemarker:freemarker", version.ref = "buildToolFloor-freemarker" }
buildToolFloor-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "buildToolFloor-httpclient" }
buildToolFloor-jdom2 = { module = "org.jdom:jdom2", version.ref = "buildToolFloor-jdom2" }
buildToolFloor-jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "buildToolFloor-jose4j" }
buildToolFloor-opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "buildToolFloor-opentelemetry" }
dokka-gradlePlugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kover-gradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
# Never used by the build: it is here so Dependabot proposes ktfmt updates.
ktfmt = { module = "com.facebook:ktfmt", version.ref = "ktfmt" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
mavenPublish-gradlePlugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
supabase-auth-kt = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase-bom" }
supabase-postgrest-kt = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabase-storage-kt = { module = "io.github.jan-tennert.supabase:storage-kt" }

[plugins]
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
