#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#KSP
ksp.useKSP2=true
ksp.incremental=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# The Maven group and version of every published module, set by the supabase-offline.published
# convention plugin. Each module's artifact name is POM_ARTIFACT_ID in its own gradle.properties.
GROUP=io.github.nesfeder.supabase-offline
VERSION_NAME=0.1.0-SNAPSHOT
