#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Kotlin/Native
# Compile the iOS klibs on a host that cannot build iOS binaries: CI checks their ABI record on
# Linux. It is Kotlin 2.4's default, stated so the record check never depends on it silently.
# kotlin.native.ignoreDisabledTargets stays unset: the warning it silences is the one that says
# this has stopped working.
kotlin.native.enableKlibsCrossCompilation=true

#KSP
ksp.useKSP2=true
ksp.incremental=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# The Maven group and version of every published module, set by the supabase-offline.published
# convention plugin. Each module's artifact name is POM_ARTIFACT_ID in its own gradle.properties.
# VERSION_NAME is the one version of both Maven artifacts and the Swift package: a release sets it
# without -SNAPSHOT and the release workflow reads it (RELEASING.md).
GROUP=io.github.nesfeder.supabase-offline
VERSION_NAME=0.1.0-SNAPSHOT

# The POM every published module carries, which Maven Central requires. A module's own
# gradle.properties overrides POM_NAME and POM_DESCRIPTION. The developer entry has no email.
POM_NAME=supabase-offline-kt
POM_DESCRIPTION=Offline-first reads and queued writes for supabase-kt's PostgREST and Storage, for Kotlin Multiplatform apps on Android and iOS.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/nesfeder/supabase-offline-kt
POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://github.com/nesfeder/supabase-offline-kt/blob/main/LICENSE
POM_LICENCE_DIST=repo
POM_SCM_URL=https://github.com/nesfeder/supabase-offline-kt
POM_SCM_CONNECTION=scm:git:git://github.com/nesfeder/supabase-offline-kt.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/nesfeder/supabase-offline-kt.git
POM_DEVELOPER_ID=nesfeder
POM_DEVELOPER_NAME=Dan Nesfeder
POM_DEVELOPER_URL=https://github.com/nesfeder
