// Points every Kotlin/Native simulator test task at the simulator this CI job created, so tests on
// a persistent machine never run in a device another session is using. Passed with --init-script
// by .github/scripts/run-gradle.sh on the maintainer's Mac only; the build files do not change.
def udid = System.getenv('CI_SIMULATOR_UDID')
if (!udid) {
    throw new GradleException('CI_SIMULATOR_UDID is not set')
}
allprojects {
    tasks.matching { it.class.name.contains('KotlinNativeSimulatorTest') }.configureEach { task ->
        task.device.set(udid)
    }
}
