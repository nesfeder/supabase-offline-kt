name: CI

# One workflow, one required check: `All Green`.
#
#   changes ─┬─ formatting ──────┬─ jvm-tests  Linux  Android host tests of both modules and their
#            │                   │                    coverage; the Android sample's tests, lint and
#            │                   │                    debug build (when `sample` says so); the
#            │                   │                    public API records (Android and iOS); the
#            │                   │                    Swift bridge's iOS klibs; the build-tool
#            │                   │                    floors check; the published-artifacts check
#            ├─ static-checks ───┴─ ios-tests  macOS  iOS simulator tests, bundled and system
#            │                                        SQLite; iOS device framework link; the Swift
#            │                                        bridge's tests, framework and header
#            └─ docs                           Linux  docs-check.yml
#   coverage-upload ──── after jvm-tests: sends the coverage report to Codecov (see the job)
#   coverage-rehearsal ─ after jvm-tests: the upload as a dry run, when CI's configuration changed
#   snapshot ─────────── after jvm-tests, on pushes to main: publishes a -SNAPSHOT to Maven Central
#                        when the repository variable PUBLISH_SNAPSHOTS is `on` (see the job)
#   final-status ── fans in every job above but the two coverage jobs and snapshot, so neither
#                   Codecov nor Maven Central being down ever blocks a merge
#
#   formatting     kempt check; skipped until .kempt.toml exists
#   static-checks  API visibility and the classifier of API changes (each self-test first), and
#                  the self-tests of the build-tool floors check, the published-artifacts check,
#                  the Swift bridge's header check and the release script (the checks themselves
#                  need Gradle or a Mac, so they run in
#                  jvm-tests); when the workflows changed, zizmor, the CI scripts' self-tests and
#                  the workflow structure check
#
# Why a fan-in: branch protection names one check instead of a list that must change with the
# jobs, and no workflow is path-filtered, so no required check waits for a run that never starts.
# final-status compares every job's result with what `changes` planned: a job that was due must
# have succeeded, a job that was not due must have been skipped. Anything else fails it.
#
# Minutes: macOS costs ten times Linux while the repository is private. The test jobs wait for
# formatting and static-checks, so a pull request that fails a cheap check never starts the macOS
# job, and a pull request that changes nothing the build reads starts neither test job.
#
# Where the iOS tests run (the rule is in .github/scripts/decide-ios-tests.py):
# - On the self-hosted runner (label offline-kt) while the repository is private and the
#   repository variable IOS_LOCAL_RUNNER is exactly `on`: every pull request event, drafts
#   included, pushes to main and manual runs. Never for the merge queue or the weekly run.
# - Otherwise on GitHub's macos-26. While private they run there only on a pull request that is
#   ready for review, a manual run, the merge queue and the weekly run; not on drafts or pushes to
#   main. Once public, on every run.
# - Dependabot's pull requests: a run Dependabot pushed or started (as actor or triggering actor)
#   never runs the iOS tests while private, and never on the self-hosted runner. To run them, a
#   maintainer reads the push and adds the `full-ci` label: that labeled event, and only that
#   event, runs the full graph. After Dependabot pushes again, the check reads held until a
#   maintainer removes the label and adds it again.
#
# When the iOS tests were due and held by that rule, the fan-in is named
# `All Green (iOS tests held)`, so it can never satisfy the required `All Green`: that name
# exists only on a run where every due job ran. A green held check means the Linux jobs passed.
#
# Forks: every job runs with a read-only token and no secrets, and nothing writes to the
# repository. What is sent outside GitHub: coverage-upload's report to Codecov, with an OIDC token
# that no fork's pull request and no run Dependabot started can obtain, and snapshot's upload to
# Maven Central, which runs only on a push to main, behind the `release` environment.

on:
  # Every pull request, whatever its base, so a stacked pull request is checked the same way.
  # ready_for_review starts the full run when a draft is marked ready. labeled starts one only
  # for the `full-ci` label; any other label runs nothing.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  merge_group:
  # Weekly, on main: the full graph on GitHub's macOS runner, whatever IOS_LOCAL_RUNNER says, so
  # the hosted image stays proven while the self-hosted runner does the day-to-day runs.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      full-graph:
        description: Run every job, the iOS tests included, whatever this ref changed
        type: boolean
        default: true

permissions:
  contents: read

# One group per pull request, where a newer run cancels an older one. Every other run has a group
# of its own, so a push to main is never cancelled or replaced by a later one, and a label event
# that runs nothing cancels nothing.
concurrency:
  group: >-
    ci-${{ (github.event.action == 'labeled' && github.event.label.name != 'full-ci')
    && format('ignored-label-{0}', github.run_id)
    || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      kotlin: ${{ steps.classify.outputs.kotlin }}
      docs: ${{ steps.classify.outputs.docs }}
      workflows: ${{ steps.classify.outputs.workflows }}
      sample: ${{ steps.classify.outputs.sample }}
      formatting: ${{ steps.formatter.outputs.configured }}
      ios-runner: ${{ steps.ios.outputs.ios-runner }}
      ios-allowed: ${{ steps.ios.outputs.ios-allowed }}
      ios-hold: ${{ steps.ios.outputs.ios-hold }}
      ios-held: ${{ steps.ios.outputs.ios-held }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Anything not named below counts as a build input, so an unfamiliar path runs the tests,
      # and a change to CI itself runs everything. A push or manual run whose changed files cannot
      # be listed runs everything; on a pull request a failed diff fails this job, and with it
      # All Green.
      # `sample` builds the Android sample too: for its own sources, the build (Gradle, the
      # version catalog, build-logic, any build script or gradle.properties), a change to the
      # library's public API records, and this workflow. Every push to main builds it, so a
      # library change that breaks the sample without moving the API records shows up there.
      - name: Classify the changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          FULL_GRAPH: ${{ inputs.full-graph }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/changed-files.txt"
          : > "$changed_files"
          everything=false
          case "$EVENT_NAME" in
            pull_request)
              # The checkout is GitHub's merge of the pull request; its first parent is the base.
              git diff --no-renames --name-only HEAD^1 HEAD > "$changed_files" ;;
            push)
              if [[ -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]] \
                && git cat-file -e "${PUSH_BEFORE}^{commit}" 2> /dev/null; then
                git diff --no-renames --name-only "$PUSH_BEFORE" HEAD > "$changed_files"
              else
                everything=true
              fi ;;
            workflow_dispatch)
              if [[ "$FULL_GRAPH" == false ]] && base=$(git merge-base origin/main HEAD 2> /dev/null); then
                git diff --no-renames --name-only "$base" HEAD > "$changed_files"
              else
                everything=true
              fi ;;
            *)
              # merge_group and schedule: the full graph.
              everything=true ;;
          esac

          kotlin=false
          docs=false
          workflows=false
          sample=false
          while IFS= read -r file; do
            case "$file" in
              samples/android/* | gradle/* | build-logic/* | *.gradle.kts | gradle.properties \
                | */gradle.properties | supabase-offline-kt*/api/* | .github/workflows/ci.yml)
                sample=true ;;
            esac
            case "$file" in
              .github/workflows/ci.yml | .github/actions/* | .github/scripts/* | .github/gradle/* \
                | .github/codecov.yml)
                kotlin=true; docs=true; workflows=true ;;
              .github/workflows/docs-check.yml | .github/workflows/docs-requirements.txt)
                docs=true; workflows=true ;;
              .github/workflows/* | .github/dependabot.yml)
                workflows=true ;;
              docs/* | mkdocs.yml | CHANGELOG.md | CONTRIBUTING.md | samples/supabase/*)
                docs=true ;;
              .github/* | *.md | LICENSE | .gitignore | .editorconfig | .git-blame-ignore-revs \
                | .kempt.toml | config/license-header* | *.properties.example)
                ;;
              *)
                kotlin=true ;;
            esac
          done < "$changed_files"
          if [[ "$everything" == true ]]; then
            kotlin=true; docs=true; workflows=true
          fi
          if [[ "$everything" == true || "$EVENT_NAME" == push ]]; then
            sample=true
          fi

          # Between stop-commands markers with a random token, so no file name is read as a
          # workflow command: the runner trims leading spaces, so indenting would not do.
          echo "Changed files ($(wc -l < "$changed_files" | tr -d ' ')):"
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::$token"
          sed 's/^/  /' "$changed_files"
          echo "::$token::"
          echo "  kotlin=$kotlin docs=$docs workflows=$workflows sample=$sample everything=$everything"
          {
            echo "kotlin=$kotlin"
            echo "docs=$docs"
            echo "workflows=$workflows"
            echo "sample=$sample"
          } >> "$GITHUB_OUTPUT"

      # The formatter's configuration lands in its own pull request; until then the job is skipped.
      - name: Look for the formatter configuration
        id: formatter
        env:
          KEMPT_CONFIG_HASH: ${{ hashFiles('.kempt.toml') }}
        run: |
          if [[ -n "$KEMPT_CONFIG_HASH" ]]; then configured=true; else configured=false; fi
          echo "  formatting configured=$configured"
          echo "configured=$configured" >> "$GITHUB_OUTPUT"

      # Where the iOS tests run and whether they may, as described at the top of this file.
      - name: Decide where the iOS tests run
        id: ios
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          IOS_LOCAL_RUNNER: ${{ vars.IOS_LOCAL_RUNNER }}
          PULL_REQUEST_DRAFT: ${{ github.event.pull_request.draft }}
          PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          KOTLIN: ${{ steps.classify.outputs.kotlin }}
        run: python3 .github/scripts/decide-ios-tests.py

  formatting:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.formatting == 'true'
    runs-on: ubuntu-latest
    # Room for both downloads to use every retry: 340 s each at most (download-verified.sh).
    timeout-minutes: 15
    env:
      KEMPT_VERSION: v0.3.1
      # SHA-256 of kempt-fmt-x86_64-unknown-linux-gnu.tar.xz for KEMPT_VERSION, from the release's
      # .sha256 asset. Change both together.
      KEMPT_LINUX_X64_SHA256: 339c06f574c03db8c45de5c1f3e15aefbafd48c886b78803f94f9b8adb7d6a01
      # The ktfmt jar kempt runs, from Maven Central, and its SHA-256 (the same as Maven Central's
      # published .sha256). It must be the version .kempt.toml asks for: kempt finds it in a
      # read-only cache and cannot download any other, so a ktfmt update fails this job until both
      # values here change with it.
      KTFMT_VERSION: '0.64'
      KTFMT_SHA256: 5b3d5286fd2defcc7dc8e28c21ddf156cc6b2d8682bdcd929ce4333e7a6201f2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # The formatter's release archive and the ktfmt jar are kept between runs under their
      # digests, so a run downloads them only when a digest above changes or the entry has expired.
      - name: Restore the formatter downloads
        id: formatter-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/formatter-downloads
          key: formatter-downloads-kempt-${{ env.KEMPT_LINUX_X64_SHA256 }}-ktfmt-${{ env.KTFMT_SHA256 }}

      # A failed download is tried three more times, after 10, 30 and 60 s, each attempt limited to
      # 60 s. A file that fails its digest fails the job at once, with no retry, and is never saved.
      - name: Download the formatter archive and the ktfmt jar
        if: steps.formatter-downloads.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          downloads="$RUNNER_TEMP/formatter-downloads"
          mkdir -p "$downloads"
          bash .github/scripts/download-verified.sh \
            "https://github.com/ZacSweers/kempt/releases/download/$KEMPT_VERSION/kempt-fmt-x86_64-unknown-linux-gnu.tar.xz" \
            "$KEMPT_LINUX_X64_SHA256" "$downloads/kempt-fmt-x86_64-unknown-linux-gnu.tar.xz"
          bash .github/scripts/download-verified.sh \
            "https://repo1.maven.org/maven2/com/facebook/ktfmt/$KTFMT_VERSION/ktfmt-$KTFMT_VERSION-with-dependencies.jar" \
            "$KTFMT_SHA256" "$downloads/ktfmt-$KTFMT_VERSION.jar"

      - name: Save the formatter downloads
        if: steps.formatter-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/formatter-downloads
          key: ${{ steps.formatter-downloads.outputs.cache-primary-key }}

      # The release archive, checked against the digest above before anything in it runs, whether
      # it came from the cache or the download. kempt's own action pipes an installer script into a
      # shell instead.
      - name: Install kempt
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/formatter-downloads/kempt-fmt-x86_64-unknown-linux-gnu.tar.xz"
          echo "$KEMPT_LINUX_X64_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/kempt"
          tar -xJf "$archive" -C "$RUNNER_TEMP/kempt" --strip-components=1
          echo "$RUNNER_TEMP/kempt" >> "$GITHUB_PATH"

      - name: Install ktfmt where kempt looks for it
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/kempt-cache"
          mkdir -p "$cache"
          cp "$RUNNER_TEMP/formatter-downloads/ktfmt-$KTFMT_VERSION.jar" "$cache/ktfmt-$KTFMT_VERSION.jar"
          echo "$KTFMT_SHA256  $cache/ktfmt-$KTFMT_VERSION.jar" | sha256sum --check --strict
          chmod a-w "$cache/ktfmt-$KTFMT_VERSION.jar" "$cache"
          echo "KEMPT_CACHE_DIR=$cache" >> "$GITHUB_ENV"

      - name: Download the formatters
        run: |
          if ! kempt update; then
            echo "::error::.kempt.toml asks for a formatter other than ktfmt $KTFMT_VERSION; update KTFMT_VERSION and KTFMT_SHA256 in ci.yml with it"
            exit 1
          fi

      - name: Check formatting
        run: kempt check

  static-checks:
    name: Static checks
    needs: changes
    if: needs.changes.outputs.kotlin == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit being checked and its first parent, the base the classifier compares with,
          # and the release tags, which decide the changelog rule it applies.
          fetch-depth: 2
          fetch-tags: true
          persist-credentials: false

      # Internal code stays out of the public surface, and compat/abi-exclusions.txt and
      # compat/gated-declarations.txt match the sources. The self-test runs first, so a check that
      # has stopped seeing violations fails loudly instead of passing quietly.
      - name: Check API visibility
        if: needs.changes.outputs.kotlin == 'true'
        run: |
          bash scripts/check-api-visibility.sh --self-test
          bash scripts/check-api-visibility.sh

      # Nothing in the shipped code writes to a console: the library reports through its log sink,
      # supabase-kt's logging, only. The self-test runs first, as above.
      - name: Check that nothing writes to a console
        if: needs.changes.outputs.kotlin == 'true'
        run: |
          python3 scripts/check-no-console.py --self-test
          python3 scripts/check-no-console.py

      # The third record beside the ABI records: every public function and constructor with its
      # parameter names in order, which neither ABI record shows, and @Throws(Throwable::class) on
      # every public suspend function. On failure, run the script with --update and commit the
      # record (CONTRIBUTING.md).
      - name: Check the public signatures record
        if: needs.changes.outputs.kotlin == 'true'
        run: |
          python3 scripts/check-public-signatures.py --self-test
          python3 scripts/check-public-signatures.py

      # What this change does to the public contract: none, patch, additive or breaking, from the
      # committed API records, Room schemas, stored-format pins and version catalog. A change that
      # needs one must add a matching line under `## Unreleased` in CHANGELOG.md. The rating goes to
      # the job summary. On a push or a scheduled run there is no pull request to rate.
      - name: Classify the change to the public contract
        if: needs.changes.outputs.kotlin == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 scripts/api-compat.py self-test
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == merge_group ]]; then
            python3 scripts/api-compat.py check-pr --base HEAD^1 --head HEAD
          fi

      # The build-tool floors' and the published artifacts' checks prove they see each kind of
      # failure. The checks themselves need Gradle, so they run where it is set up: the Android
      # host tests. So does the release script's, whose commands the release workflows run.
      - name: Test the build-tool floors check
        if: needs.changes.outputs.kotlin == 'true'
        run: python3 scripts/check-build-tool-floors.py --self-test

      - name: Test the published artifacts check
        if: needs.changes.outputs.kotlin == 'true'
        run: python3 scripts/check-published-artifacts.py --self-test

      # The header check itself reads a linked framework, so it runs in the iOS job.
      - name: Test the Swift bridge's header check
        if: needs.changes.outputs.kotlin == 'true'
        run: python3 scripts/check-bridge-header.py --self-test

      # The check itself reads the built Swift package, so it runs in the iOS job.
      - name: Test the Swift package's public API check
        if: needs.changes.outputs.kotlin == 'true'
        run: python3 scripts/check-swift-public-api.py --self-test

      - name: Test the release script
        if: needs.changes.outputs.kotlin == 'true' || needs.changes.outputs.workflows == 'true'
        run: python3 scripts/release.py self-test

      # The scripts CI itself depends on, each proved by its own self-test, then the structure
      # of the workflows: the fan-in needs every job but the two coverage jobs, `$/` references
      # exist, only ios-tests may use the self-hosted runner, nothing Dependabot can trigger reaches
      # it, and only the listed jobs may mint an OIDC token, with exact permissions, never on a run
      # Dependabot started.
      - name: Check the CI scripts and the workflow structure
        if: needs.changes.outputs.workflows == 'true'
        run: |
          python3 .github/scripts/decide-ios-tests.py --self-test
          python3 .github/scripts/check-job-results.py --self-test
          python3 .github/scripts/check-coverage-report.py --self-test
          python3 .github/scripts/check-workflows.py --self-test
          python3 .github/scripts/check-workflows.py
          shellcheck --shell=bash .github/scripts/*.sh .github/actions/*/*.sh scripts/test-swift-package.sh

      # Template injection, unpinned actions, broad permissions, persisted credentials. Findings
      # fail the job and appear as annotations; nothing is uploaded to code scanning.
      - name: Audit the workflows
        if: needs.changes.outputs.workflows == 'true'
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          inputs: .github
          advanced-security: false
          annotations: true

  jvm-tests:
    name: Android host tests
    needs: [changes, formatting, static-checks]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.kotlin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-project

      # Robolectric on the JVM; the host SQLite comes from the JVM driver's binary for this machine.
      # The Kover tasks read the coverage these test runs record and never run a test again.
      # koverVerify is what `check` runs: a 50% floor that fails only when measurement broke.
      # When `sample` says so, the same invocation (one configuration, not two) also runs the
      # Android sample (samples/android): its host tests, Robolectric's Compose tests among them,
      # lint against its own baseline, and its debug APK. The APK is also the build-tool floors'
      # signing proof: the build creates a debug keystore and signs the APK with the Bouncy Castle
      # the floors raise.
      - name: Run the Android host tests, and the Android sample's
        env:
          SAMPLE: ${{ needs.changes.outputs.sample }}
        run: |
          tasks=(
            :supabase-offline-kt:testAndroidHostTest
            :supabase-offline-kt-testing:testAndroidHostTest
            :supabase-offline-kt:koverXmlReport
            :supabase-offline-kt:koverVerify
            :supabase-offline-kt-testing:koverVerify
          )
          if [[ "$SAMPLE" == true ]]; then
            tasks+=(
              :samples:android:testDebugUnitTest
              :samples:android:lint
              :samples:android:assembleDebug
            )
          fi
          ./gradlew "${tasks[@]}" --continue --stacktrace

      - name: Count the tests that ran
        if: ${{ !cancelled() }}
        run: >-
          python3 .github/scripts/count-test-results.py "Android host tests" testAndroidHostTest
          supabase-offline-kt supabase-offline-kt-testing

      - name: Count the Android sample's tests
        if: ${{ !cancelled() && needs.changes.outputs.sample == 'true' }}
        run: >-
          python3 .github/scripts/count-test-results.py "Android sample tests" testDebugUnitTest
          samples/android

      # The core module's report: it covers some lines, and every file in it is one Codecov can
      # place in the repository.
      - name: Check the coverage report
        run: >-
          python3 .github/scripts/check-coverage-report.py
          supabase-offline-kt/build/reports/kover/report.xml

      # For the two coverage jobs; only coverage-upload can authenticate to Codecov, never this one.
      - name: Keep the coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-kotlin
          path: supabase-offline-kt/build/reports/kover/report.xml
          if-no-files-found: error
          retention-days: 1

      # Each module's api/ records against what the code compiles to: the Android target, and the
      # iOS klibs, which cross-compile on Linux. `check` would run these tasks, but this job names
      # its tasks. On failure, run updateKotlinAbi and commit the records (CONTRIBUTING.md).
      - name: Check the public API records
        if: ${{ !cancelled() }}
        run: >-
          ./gradlew
          :supabase-offline-kt:checkKotlinAbi
          :supabase-offline-kt-testing:checkKotlinAbi
          --stacktrace

      # The Swift bridge (supabase-offline-swift-bridge) has iOS targets only and is never
      # published, so it has no API record; its iOS klibs cross-compile here, and the iOS job tests
      # and links it.
      - name: Compile the Swift bridge's iOS klibs
        if: ${{ !cancelled() }}
        run: >-
          ./gradlew
          :supabase-offline-swift-bridge:compileKotlinIosArm64
          :supabase-offline-swift-bridge:compileKotlinIosSimulatorArm64
          --stacktrace

      # The build-tool floors (gradle/libs.versions.toml) hold in every classpath the plugins and
      # their tools resolve, and each still raises something (scripts/check-build-tool-floors.py).
      - name: Check the build-tool floors
        if: ${{ !cancelled() }}
        run: python3 scripts/check-build-tool-floors.py

      # What Maven Central would receive: both modules published to build/maven-repository, each
      # artifact's POM, sources, documentation jar and checksums checked, and its files and
      # dependencies compared with compat/published-artifacts.txt. On failure after an intended
      # change, run the script with --update and commit the record (CONTRIBUTING.md).
      - name: Check the published artifacts
        if: ${{ !cancelled() }}
        run: python3 scripts/check-published-artifacts.py

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-host-test-reports
          path: |
            */build/reports/tests/
            */build/test-results/
            samples/android/build/reports/
            samples/android/build/test-results/
          retention-days: 7

  ios-tests:
    name: iOS tests
    needs: [changes, formatting, static-checks]
    if: >-
      ${{ !cancelled() && !failure()
      && needs.changes.outputs.kotlin == 'true' && needs.changes.outputs.ios-allowed == 'true' }}
    # The self-hosted runner only when changes decided `local`; anything else is GitHub's macos-26,
    # the image macos-latest resolved to when this workflow was written.
    runs-on: >-
      ${{ needs.changes.outputs.ios-runner == 'local'
      && fromJSON('["self-hosted", "macOS", "ARM64", "offline-kt"]') || 'macos-26' }}
    timeout-minutes: 45
    env:
      IOS_RUNNER: ${{ needs.changes.outputs.ios-runner }}
      XCODE_VERSION: '26.6'
      # Xcode for this job's processes only: no sudo, and nothing changes for anything else on the
      # machine. The self-hosted runner has 26.6 as Xcode.app; the hosted image names it by version.
      DEVELOPER_DIR: >-
        ${{ needs.changes.outputs.ios-runner == 'local'
        && '/Applications/Xcode.app/Contents/Developer'
        || '/Applications/Xcode_26.6.app/Contents/Developer' }}
    steps:
      # Every step that protects the self-hosted runner runs only when IOS_RUNNER is `local`. On a
      # self-hosted runner with any other value they would all be skipped, so stop before anything.
      # Anything but GitHub's own runner counts, so a runner that reports no environment stops too.
      - name: Check that the self-hosted runner's protections are on
        if: runner.environment != 'github-hosted' && env.IOS_RUNNER != 'local'
        run: |
          echo "::error::This job is not on a GitHub-hosted runner, but IOS_RUNNER is not 'local', so every step that protects the machine would be skipped."
          exit 1

      # On a self-hosted runner, before anything else: a record of the home directory's first two
      # levels and of a few persistence points in it, which the last step compares against. The job
      # must leave the home as it found it.
      - name: Record the home directory
        if: env.IOS_RUNNER == 'local'
        uses: $/.github/actions/home-snapshot
        with:
          mode: record

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # On a self-hosted runner the build gets a home and directories of its own under RUNNER_TEMP,
      # set before any setup step: Java's user.home and temporary directory, the XDG and Android
      # user directories, the Gradle User Home, the Kotlin/Native data directory and TMPDIR (which
      # the JVM ignores on macOS, hence java.io.tmpdir). clean-up-local-runner.sh removes them all.
      - name: Give the build directories of its own
        if: env.IOS_RUNNER == 'local'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/offline-kt-ci"
          home="$root/home"
          mkdir -p "$home/.config" "$home/.cache" "$home/.local/share" "$home/.local/state" \
            "$home/.android" "$root/gradle-home" "$root/konan" "$root/tmp"
          {
            echo "JAVA_TOOL_OPTIONS=-Duser.home=$home -Djava.io.tmpdir=$root/tmp"
            echo "XDG_CONFIG_HOME=$home/.config"
            echo "XDG_CACHE_HOME=$home/.cache"
            echo "XDG_DATA_HOME=$home/.local/share"
            echo "XDG_STATE_HOME=$home/.local/state"
            echo "ANDROID_USER_HOME=$home/.android"
            echo "GRADLE_USER_HOME=$root/gradle-home"
            echo "KONAN_DATA_DIR=$root/konan"
            echo "TMPDIR=$root/tmp"
          } >> "$GITHUB_ENV"

      # The whole output first: piping it into `head` can close the pipe while xcodebuild is still
      # writing, and xcodebuild aborts on the broken pipe.
      # The summary also names the runner's environment, which the guard above reads.
      - name: Check the Xcode version
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          output=$(xcodebuild -version)
          version="${output%%$'\n'*}"
          if [[ "$IOS_RUNNER" == local ]]; then
            where="the self-hosted runner (label offline-kt)"
          else
            where="GitHub's macos-26 runner"
          fi
          echo "  $version on $where (runner environment: ${RUNNER_KIND:-none})"
          echo "iOS tests ran on $where (runner environment: ${RUNNER_KIND:-none}), $version." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$version" != "Xcode $XCODE_VERSION" ]]; then
            echo "::error::Expected Xcode $XCODE_VERSION, found $version"
            exit 1
          fi

      - uses: $/.github/actions/setup-project
        with:
          gradle-cache: ${{ env.IOS_RUNNER != 'local' }}
          job-home: ${{ env.IOS_RUNNER == 'local' && format('{0}/offline-kt-ci/home', runner.temp) || '' }}

      - name: Read the Kotlin version
        id: kotlin
        if: env.IOS_RUNNER != 'local'
        run: |
          version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          if [[ -z "$version" ]]; then
            echo "::error::No kotlin version in gradle/libs.versions.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Hosted only. The Kotlin/Native toolchain, its dependencies and its compiler caches, which
      # setup-gradle does not cache. Keyed on the Kotlin and Xcode versions. Written only from runs
      # on main, as setup-gradle's cache is, so every branch can read it.
      - name: Restore Kotlin/Native
        id: konan
        if: env.IOS_RUNNER != 'local'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-kotlin${{ steps.kotlin.outputs.version }}

      # On a self-hosted runner, a simulator of the job's own, never one another session uses.
      - name: Create a simulator for this job
        if: env.IOS_RUNNER == 'local'
        run: bash .github/scripts/create-simulator.sh

      - name: Run the iOS simulator tests
        run: >-
          bash .github/scripts/run-gradle.sh
          :supabase-offline-kt:iosSimulatorArm64Test
          :supabase-offline-kt-testing:iosSimulatorArm64Test
          --continue

      - name: Count the tests that ran
        if: ${{ !cancelled() }}
        run: >-
          python3 .github/scripts/count-test-results.py "iOS simulator tests" iosSimulatorArm64Test
          supabase-offline-kt supabase-offline-kt-testing

      # The engine suite again on the system SQLite, which the Swift package links, with the Swift
      # bridge's suite and its framework, which builds only on that SQLite. A separate build: see
      # supabase-offline-kt/build.gradle.kts.
      - name: Run the iOS suites on the system SQLite and link the Swift bridge's framework
        id: system-sqlite
        run: >-
          bash .github/scripts/run-gradle.sh
          :supabase-offline-kt:iosSimulatorArm64Test
          :supabase-offline-swift-bridge:iosSimulatorArm64Test
          :supabase-offline-swift-bridge:linkReleaseFrameworkIosArm64
          -Psupabase.offline.iosSqlite=system

      - name: Count the tests that ran on the system SQLite
        if: ${{ !cancelled() && steps.system-sqlite.outcome != 'skipped' }}
        run: >-
          python3 .github/scripts/count-test-results.py "iOS simulator tests, system SQLite"
          iosSimulatorArm64Test supabase-offline-kt supabase-offline-swift-bridge

      # The framework's Objective-C header names nothing but the bridge's own types and the Kotlin
      # runtime's, and is the one recorded (scripts/check-bridge-header.py; on failure after an
      # intended change, run it with --update and commit the record).
      - name: Check the Swift bridge's header
        run: python3 scripts/check-bridge-header.py

      # Tests never compile the device target or link a framework; this does.
      - name: Link the iOS device framework
        run: bash .github/scripts/run-gradle.sh :supabase-offline-kt:linkReleaseFrameworkIosArm64

      # The Swift package, on the self-hosted runner only, never on a hosted Mac: the core framework
      # it wraps, built here, then its tests on this job's simulator with every warning an error,
      # and the check that its public API shows nothing of the core (scripts/test-swift-package.sh).
      # xcodebuild writes in the job's folder; SwiftPM's one link in ~ is recorded by its target.
      - name: Build the core framework for the Swift package
        if: env.IOS_RUNNER == 'local'
        run: >-
          bash .github/scripts/run-gradle.sh
          :supabase-offline-swift-bridge:assembleSupabaseOfflineCoreDebugXCFramework
          -Psupabase.offline.iosSqlite=system

      - name: Test the Swift package
        if: env.IOS_RUNNER == 'local'
        run: >-
          bash scripts/test-swift-package.sh --simulator "$CI_SIMULATOR_UDID"
          --derived-data "$RUNNER_TEMP/offline-kt-ci/swift-derived-data"

      - name: Save Kotlin/Native
        if: >-
          env.IOS_RUNNER != 'local' && github.ref == 'refs/heads/main'
          && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-reports
          path: |
            */build/reports/tests/
            */build/test-results/
          retention-days: 7

      # Whatever happened above: delete the simulator, stop anything still running from the job's
      # directories, remove those directories and the JDK setup-java installed, list what went,
      # and fail if anything is left.
      - name: Leave nothing behind on the self-hosted runner
        if: always() && env.IOS_RUNNER == 'local'
        run: bash .github/scripts/clean-up-local-runner.sh

      # Then the home directory must match the record the first step made.
      - name: Compare the home directory with its record
        if: always() && env.IOS_RUNNER == 'local'
        uses: $/.github/actions/home-snapshot
        with:
          mode: compare

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/docs-check.yml

  # Codecov. coverage-upload sends the report jvm-tests kept; coverage-rehearsal makes the same
  # call with the CLI's dry run, which sends nothing. Neither is in final-status: Codecov being down
  # must never block a merge.
  #
  # coverage-upload is the only job that can authenticate to Codecov. It runs no project code and
  # signs in with OIDC, so there is no stored secret. It uploads on a push to main, and on every run
  # once the repository is public: the free plan allows a private repository 250 uploads a month,
  # and pull requests would pass that. A scheduled run has no event payload, so its visibility reads
  # as not public. A run Dependabot pushed or started never holds the OIDC token, so an action
  # update never runs with it before a maintainer has read the change; a fork's pull request is
  # given none.
  coverage-upload:
    name: Coverage upload
    needs: jvm-tests
    if: >-
      github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]'
      && (github.event_name == 'push' || github.event.repository.visibility == 'public')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the checkout, whose file list the CLI maps the report's paths onto
      id-token: write # the OIDC token Codecov accepts in place of an upload token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-kotlin
          path: supabase-offline-kt/build/reports/kover

      - uses: $/.github/actions/install-codecov-cli

      # A refused or throttled upload fails this step, but not the job or the run; the next step
      # puts a warning on the run's page instead.
      - name: Upload to Codecov
        id: upload
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          binary: ${{ runner.temp }}/codecov
          use_oidc: true
          files: supabase-offline-kt/build/reports/kover/report.xml
          disable_search: true
          plugins: noop
          flags: kotlin
          name: android-host-tests
          disable_telem: true
          fail_ci_if_error: true
          verbose: true

      - name: Warn that the upload failed
        if: steps.upload.outcome == 'failure'
        run: >-
          echo "::warning title=Codecov upload failed::The coverage report did not reach Codecov;
          the Upload to Codecov step's log says why."

  # The upload's dry run, holding no token: it reads the report and maps its files onto the
  # repository. It runs when CI's configuration changed, Codecov's settings included, and
  # coverage-upload does not (its condition, negated), so a change to the upload is proved on its
  # pull request, a Dependabot update of these actions included.
  coverage-rehearsal:
    name: Coverage upload rehearsal
    needs: [changes, jvm-tests]
    if: >-
      needs.changes.outputs.workflows == 'true'
      && !(github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]'
      && (github.event_name == 'push' || github.event.repository.visibility == 'public'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the checkout, whose file list the CLI maps the report's paths onto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-kotlin
          path: supabase-offline-kt/build/reports/kover

      - uses: $/.github/actions/install-codecov-cli

      - name: Rehearse the upload without sending it
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          binary: ${{ runner.temp }}/codecov
          dry_run: true
          files: supabase-offline-kt/build/reports/kover/report.xml
          disable_search: true
          plugins: noop
          flags: kotlin
          name: android-host-tests
          disable_telem: true
          fail_ci_if_error: true
          verbose: true

  # A -SNAPSHOT of main on Maven Central's snapshot repository, after the host tests pass on a push
  # to main. Inert until the owner turns snapshots on for the namespace in the Central Portal and
  # sets the repository variable PUBLISH_SNAPSHOTS to `on` (RELEASING.md, "Snapshots"). It takes the
  # Portal token and signing key from the `release` environment, the only job in this workflow to
  # use it; when that environment gains a required reviewer, this job would move to a `snapshot`
  # environment holding the same secrets and no reviewer, which RELEASING.md weighs ("Snapshots").
  # It publishes nothing unless VERSION_NAME ends in -SNAPSHOT: a release version goes through
  # release.yml alone. It restores no cache.
  snapshot:
    name: Publish a snapshot
    needs: jvm-tests
    if: >-
      github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]'
      && (github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.PUBLISH_SNAPSHOTS == 'on')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        run: python3 scripts/release.py snapshot-version --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.version.outputs.snapshot == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.version.outputs.snapshot == 'true'

      # The secrets reach Gradle through this step's environment only, and no configuration cache
      # entry is written with the signing key in it.
      - name: Publish the snapshot
        if: steps.version.outputs.snapshot == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace

      - name: Say why nothing was published
        if: steps.version.outputs.snapshot != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          echo "::notice title=No snapshot::VERSION_NAME is $VERSION, not a -SNAPSHOT; only the
          Release workflow publishes a release version."

  final-status:
    # The required check is exactly `All Green`. A run that held iOS tests which were due, and a
    # label event that ran nothing, report under other names, so neither can satisfy it.
    name: >-
      ${{ (github.event.action == 'labeled' && github.event.label.name != 'full-ci')
      && 'All Green (label ignored)'
      || needs.changes.outputs.ios-held == 'true' && 'All Green (iOS tests held)'
      || 'All Green' }}
    if: always() && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    # Every job but coverage-upload, coverage-rehearsal and snapshot, left out on purpose (see them).
    needs: [changes, formatting, static-checks, jvm-tests, ios-tests, docs]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Check every job's result against the plan
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check-job-results.py
