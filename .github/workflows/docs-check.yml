name: Docs check

# Strict build, link checks, the install snippets' version, and the built site uploaded as the
# `docs-site` artifact so it can be downloaded and previewed, with the Kotlin API reference built
# and placed at site/api/kotlin/ as docs-publish.yml does it (the Swift one is a release's, and is
# left out). Nothing is published: publishing is docs-publish.yml, which CI never calls. ci.yml
# calls this workflow when the documentation changed and folds its result into the single required
# `All Green` check; the pages' spelling is checked by ci.yml's formatting job, on every run.

on:
  workflow_call:

permissions: {}

env:
  PYTHON_VERSION: '3.14'
  # Silences the MkDocs 2.0 banner Material for MkDocs prints on every run.
  NO_MKDOCS_2_WARNING: 'true'

jobs:
  check:
    name: Strict build and link check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Kotlin API reference, built as docs-publish.yml builds it: JDK 17, the wrapper's
      # checksum, no Gradle cache, and the image's ANDROID_HOME for the Android SDK.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build the Kotlin API reference
        run: bash .github/scripts/run-gradle.sh :dokkaGenerate -Psupabase.offline.sourceCommit="$(git rev-parse HEAD)"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/workflows/docs-requirements.txt

      - name: Verify the vendored Mermaid
        working-directory: docs/assets/javascripts/mermaid
        run: sha256sum --check --strict mermaid.min.js.sha256

      - name: Install the pinned toolchain
        run: pip install -r .github/workflows/docs-requirements.txt

      # --strict fails on broken internal links and anchors in the Markdown, nav entries with no
      # page, pages left out of the nav, and missing snippet files.
      - name: Build the site in strict mode
        id: build
        run: mkdocs build --strict

      # After MkDocs, as docs-publish.yml does it, so the link checks below see it.
      - name: Place the Kotlin API reference
        run: cp -R build/dokka/html site/api/kotlin

      - name: Check the Kotlin API reference
        run: |
          if [[ ! -f site/api/kotlin/index.html ]]; then
            echo "::error::The Kotlin API reference holds no landing page."
            exit 1
          fi

      # Every Swift block of the DocC articles, the package's own README (swift/README.md), the
      # README's Swift section and the site's Swift pages is code the Swift package's tests
      # compile; the self-test runs first.
      - name: Check the Swift listings
        run: |
          python3 scripts/check-swift-doc-listings.py --self-test
          python3 scripts/check-swift-doc-listings.py

      # Every install snippet a reader copies (the README's, the Swift package's README and
      # documentation catalog, the site's pages) names one version: the last release, which the
      # samples take in the version catalog, or the release the pull request preparing it moved
      # them to (RELEASING.md). The release script's self-test, which covers the check, runs first.
      - name: Check the install snippets
        run: |
          python3 scripts/release.py self-test
          python3 scripts/release.py check-snippets

      - name: Upload the built site for preview
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/
          if-no-files-found: error
          retention-days: 14

      # 404.html links to assets by absolute path under the site_url path (/supabase-offline-kt/),
      # because it is served at any depth. Map that path onto site/ so those links are checked too.
      - name: Map the site path for absolute links
        run: |
          mkdir -p "$RUNNER_TEMP/linkcheck-root"
          ln -s "$GITHUB_WORKSPACE/site" "$RUNNER_TEMP/linkcheck-root/supabase-offline-kt"

      # The links into the Swift API reference (site/swift/) are left out: only a release's publish
      # places it. The Kotlin one's pages are checked like every other page, anchors included.
      - name: Check internal links and anchors in the built site
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            --index-files index.html
            --root-dir ${{ runner.temp }}/linkcheck-root
            --exclude '/site/swift/'
            'site/**/*.html'
          output: ${{ runner.temp }}/lychee-internal.md
          fail: true

      # Reported in the job summary but not blocking: a third-party site being down should not
      # fail a pull request.
      - name: Check external links in the source pages
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --scheme https --scheme http
            --max-retries 3
            --accept '200..=299,429'
            --exclude-loopback
            'docs/**/*.md' CHANGELOG.md CONTRIBUTING.md
          output: ${{ runner.temp }}/lychee-external.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
