name: Docs publish

# Builds the site and publishes it to GitHub Pages. It runs only when started by hand
# (workflow_dispatch) or called (workflow_call) by a release workflow or by Docs republish
# (docs-republish.yml); nothing on a pull request or a push reaches it, and CI calls docs-check.yml
# instead, which cannot publish.
#
# The repository is set up for it: Settings > Pages > Source is GitHub Actions, which created the
# `github-pages` environment, and that environment deploys from `main` only. Its branch policy is
# what stops anyone with write access from publishing from an unmerged branch; a release run from a
# tag would need the tag's pattern added there first.
#
# A workflow that calls this one must grant `pages: write` and `id-token: write` to the calling
# job, and must not use the concurrency group `docs-publish` or `pages`, which this one uses.
#
# The site's API reference page (docs/api/index.md) leads to two references, placed beside the
# MkDocs pages in the one Pages artifact:
#
#   /api/kotlin/  Dokka, which runs on Linux: this job builds it from the commit it checked out
#                 (`:dokkaGenerate`, the published modules' public packages), so a publish by hand
#                 or a republish shows the branch it ran on, and a release the released tag.
#   /swift/       DocC, which builds only on macOS: the release's macOS job builds it
#                 (scripts/build-swift-docs.sh) and uploads it as an artifact of the run, which the
#                 caller names in `swift-reference`. A publish without it (by hand, or a caller that
#                 names none) leaves /swift/ out of the site and says so in the run's summary. Docs
#                 republish publishes main with a Release run's copy.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to the caller's ref)
        type: string
        default: ''
      swift-reference:
        description: The calling run's artifact holding the Swift API reference, built for static hosting
        type: string
        default: ''
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-publish
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.14'
  # Silences the MkDocs 2.0 banner Material for MkDocs prints on every run.
  NO_MKDOCS_2_WARNING: 'true'

jobs:
  build:
    name: Build the site for GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # JDK 17 and the wrapper's checksum, as CI's jobs have them. No Gradle cache, for the reason
      # there is no pip cache below. The image's ANDROID_HOME gives Gradle the Android SDK.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Into build/dokka/html, with its source links pinned to the commit checked out.
      - name: Build the Kotlin API reference
        run: bash .github/scripts/run-gradle.sh :dokkaGenerate -Psupabase.offline.sourceCommit="$(git rev-parse HEAD)"

      # No pip cache: a publishing workflow restores nothing another run could have written.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify the vendored Mermaid
        working-directory: docs/assets/javascripts/mermaid
        run: sha256sum --check --strict mermaid.min.js.sha256

      - name: Install the pinned toolchain
        run: pip install -r .github/workflows/docs-requirements.txt

      - name: Build the site in strict mode
        run: mkdocs build --strict

      # After MkDocs, which would otherwise read the generated pages as its own; beside the page
      # site/api/index.html that links to it.
      - name: Place the Kotlin API reference
        run: cp -R build/dokka/html site/api/kotlin

      - name: Check the Kotlin API reference
        run: |
          if [[ ! -f site/api/kotlin/index.html ]]; then
            echo "::error::The Kotlin API reference holds no landing page."
            exit 1
          fi

      # The Swift API reference, as the release's macOS job built it: data, placed and never run.
      - name: Download the Swift API reference
        if: inputs.swift-reference != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.swift-reference }}
          path: ${{ runner.temp }}/swift-reference-artifact

      # The artifact is one tar (DocC's file names hold colons, which the artifact store refuses);
      # its top-level folder is dropped so the site lands at site/swift/ as before.
      - name: Unpack the Swift API reference
        if: inputs.swift-reference != ''
        run: |
          mkdir -p site/swift
          tar -xf "$RUNNER_TEMP/swift-reference-artifact/swift-reference.tar" -C site/swift --strip-components=1

      # DocC's root page documents nothing (and, in a release built before build-swift-docs.sh
      # rewrote it, loads nothing): this static page, written over it, opens the package's page.
      - name: Write the Swift API reference's landing redirect
        if: inputs.swift-reference != ''
        run: |
          cat > site/swift/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Swift API reference</title>
          <meta http-equiv="refresh" content="0; url=documentation/supabaseoffline/">
          <link rel="canonical" href="documentation/supabaseoffline/">
          </head>
          <body>
          <p><a href="documentation/supabaseoffline/">The Swift API reference</a></p>
          </body>
          </html>
          EOF

      - name: Check the Swift API reference
        env:
          SWIFT_REFERENCE: ${{ inputs.swift-reference }}
        run: |
          if [[ -z "$SWIFT_REFERENCE" ]]; then
            echo "::warning::Published without the Swift API reference: /swift/ is not part of this site."
            echo "Published without the Swift API reference: /swift/ is not part of this site." >> "$GITHUB_STEP_SUMMARY"
          elif [[ ! -f site/swift/documentation/supabaseoffline/index.html ]]; then
            echo "::error::The Swift API reference holds no SupabaseOffline landing page."
            exit 1
          fi

      # No configure-pages step: nothing here reads its outputs (site_url is fixed in mkdocs.yml),
      # and its Pages API call would need `pages: read` on this job.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Every job that can mint an OIDC token carries this guard (.github/scripts/check-workflows.py).
    if: github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # publish the site artifact to GitHub Pages
      id-token: write # the OIDC token deploy-pages exchanges with the Pages service
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
