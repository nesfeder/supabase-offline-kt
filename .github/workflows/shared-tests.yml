name: Shared Tests (Android & iOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shared-tests:
    name: Library checks
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Internal code stays out of the public surface. The self-test runs first, so a check that
      # has stopped seeing violations fails loudly instead of passing quietly.
      - name: Check API visibility
        run: |
          bash scripts/check-api-visibility.sh --self-test
          bash scripts/check-api-visibility.sh

      - uses: ./.github/actions/setup-project

      # check runs the Android host tests (Robolectric) and the iOS simulator tests of both modules.
      - name: Run library checks
        run: ./gradlew :supabase-offline-kt:check :supabase-offline-kt-testing:check --stacktrace

      # The iOS suite again on the system SQLite (Room's native driver over libsqlite3), the one the
      # Swift package is to link. It is a separate build: see supabase-offline-kt/build.gradle.kts.
      - name: Run the iOS suite on the system SQLite
        run: ./gradlew :supabase-offline-kt:iosSimulatorArm64Test -Psupabase.offline.iosSqlite=system --stacktrace

      # check never compiles the iOS device target or links the SKIE framework; this does.
      - name: Link the iOS device framework
        run: ./gradlew :supabase-offline-kt:linkReleaseFrameworkIosArm64 --stacktrace
