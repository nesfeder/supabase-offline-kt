name: Upstream canary

# The decision surface for the supabase-kt minors that .github/dependabot.yml holds back.
#
# Every Monday it compares the pinned supabase-kt BOM with the newest release on Maven Central.
# When upstream has a newer minor, it moves the pin in this job's checkout only, builds and runs
# the Android host tests of both modules against it, and opens or updates one issue labelled
# `upstream-pin` saying what came out and whether the library still builds and passes. Nothing is
# committed and no pull request is opened: moving the pin is a decision, made in a pull request
# that also moves the pass-through set and updates the compatibility page and the changelog
# (CONTRIBUTING.md, "Held dependencies"; docs/project/compatibility.md, "supabase-kt").
#
# A newer patch of the pinned minor is left to Dependabot, which proposes supabase-kt patches as
# pull requests, and pre-releases are ignored. When nothing is newer, the job says so and builds
# nothing. A build or test failure against the newer release is the finding, reported in the
# issue; the job itself fails only on its own errors (Maven Central unreachable, the catalog
# unreadable, the issue not written).
#
# Only the schedule, which runs on main, and a maintainer's manual run start it. Dependabot can
# raise neither event, and no pull request or push starts it: check-workflows.py holds the
# triggers and the permissions below.

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC, an hour after Dependabot's Gradle run
  workflow_dispatch:
    inputs:
      pretend_pinned:
        description: >-
          Testing only: a version such as 3.7.0 to compare with upstream in place of the catalog's
          pin, so the build and the issue can be exercised. Leave empty for a real check.
        type: string
        required: false
        default: ''

permissions: {}

# One run at a time; a second waits instead of cancelling one that may be writing the issue.
concurrency:
  group: upstream-canary
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  canary:
    name: Build against the newest supabase-kt
    if: github.repository == 'nesfeder/supabase-offline-kt'
    runs-on: ubuntu-latest
    # The host tests take 5 to 7 minutes in ci.yml with a warm Gradle cache; this job has none.
    timeout-minutes: 30
    permissions:
      contents: read # the checkout
      issues: write # the tracking issue and its label
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every version is checked to be a plain release number (digits and two dots) before it
      # reaches a comparison, sed, an output or the issue.
      - name: Compare the pin with the newest supabase-kt release
        id: versions
        env:
          PRETEND_PINNED: ${{ inputs.pretend_pinned }}
        run: |
          set -euo pipefail
          plain_version='^[0-9]+\.[0-9]+\.[0-9]+$'

          catalog_pin=$(sed -n 's/^supabase-bom = "\([^"]*\)"$/\1/p' gradle/libs.versions.toml)
          if [[ ! "$catalog_pin" =~ $plain_version ]]; then
            echo "::error::gradle/libs.versions.toml has no single plain supabase-bom version"
            exit 1
          fi
          pinned="$catalog_pin"
          pretend=false
          if [[ -n "$PRETEND_PINNED" ]]; then
            if [[ ! "$PRETEND_PINNED" =~ $plain_version ]]; then
              echo "::error::pretend_pinned must be a plain version such as 3.7.0"
              exit 1
            fi
            pinned="$PRETEND_PINNED"
            pretend=true
          fi

          # The newest plain release: betas and release candidates never become the pin.
          metadata_url=https://repo1.maven.org/maven2/io/github/jan-tennert/supabase/bom/maven-metadata.xml
          metadata=$(curl --fail --silent --show-error --location --max-time 60 \
            --retry 3 --retry-delay 10 --retry-all-errors "$metadata_url")
          latest=$(grep -oE '<version>[^<]*</version>' <<< "$metadata" \
            | sed -e 's/<version>//' -e 's:</version>::' \
            | grep -E "$plain_version" | sort -V | tail -n 1 || true)
          if [[ ! "$latest" =~ $plain_version ]]; then
            echo "::error::No plain release version in $metadata_url"
            exit 1
          fi

          # A newer minor or major is the canary's to report; a newer patch is Dependabot's.
          latest_minor="${latest%.*}"
          pinned_minor="${pinned%.*}"
          higher_minor=$(printf '%s\n%s\n' "$pinned_minor" "$latest_minor" | sort -V | tail -n 1)
          newer=false
          if [[ "$latest_minor" != "$pinned_minor" && "$higher_minor" == "$latest_minor" ]]; then
            newer=true
            verdict="supabase-kt $latest is newer than the pinned minor ($pinned): building and testing against it."
          elif [[ "$latest_minor" == "$pinned_minor" && "$latest" != "$pinned" ]]; then
            verdict="The newest supabase-kt release, $latest, is in the pinned minor ($pinned). Dependabot proposes patches, so nothing is built."
          else
            verdict="The newest supabase-kt release is $latest and the pin is $pinned. Nothing is newer, so nothing is built."
          fi
          if [[ "$pretend" == true ]]; then
            verdict="$verdict (A manual test run: pretend_pinned $pinned stands in for the catalog's $catalog_pin.)"
          fi
          echo "$verdict"
          echo "$verdict" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "newer=$newer"
            echo "latest=$latest"
            echo "pinned=$pinned"
            echo "catalog-pin=$catalog_pin"
            echo "pretend=$pretend"
          } >> "$GITHUB_OUTPUT"

      # As in ci.yml's self-hosted runs, the Gradle User Home is the job's own, under RUNNER_TEMP,
      # and setup-gradle's cache is off, so nothing built against an unadopted supabase-kt is
      # saved for another run.
      - name: Give the build a Gradle home of its own
        if: steps.versions.outputs.newer == 'true'
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-home" >> "$GITHUB_ENV"

      - uses: $/.github/actions/setup-project
        if: steps.versions.outputs.newer == 'true'
        with:
          gradle-cache: 'false'

      # In this checkout only: the job holds no credential that could push it. With pretend_pinned
      # the newest release can be the catalog's own pin, and then nothing changes.
      - name: Move the pin to the newest release in this checkout
        if: steps.versions.outputs.newer == 'true'
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          set -euo pipefail
          sed -i "s/^supabase-bom = \"[^\"]*\"$/supabase-bom = \"$LATEST\"/" gradle/libs.versions.toml
          moved_to=$(sed -n 's/^supabase-bom = "\([^"]*\)"$/\1/p' gradle/libs.versions.toml)
          if [[ "$moved_to" != "$LATEST" ]]; then
            echo "::error::The pin in gradle/libs.versions.toml did not move to $LATEST"
            exit 1
          fi
          changed=$(git diff --name-only)
          if [[ -n "$changed" && "$changed" != gradle/libs.versions.toml ]]; then
            echo "::error::Moving the pin changed more than gradle/libs.versions.toml"
            exit 1
          fi
          # Between stop-commands markers, so nothing in the diff is read as a workflow command.
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::$token"
          git diff
          echo "::$token::"

      # A failure here is what the issue reports, not a failure of this job. The step's own
      # timeout leaves the job time to write the issue.
      - name: Build and run the Android host tests against the newest release
        id: build
        if: steps.versions.outputs.newer == 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: >-
          bash .github/scripts/run-gradle.sh
          :supabase-offline-kt:testAndroidHostTest
          :supabase-offline-kt-testing:testAndroidHostTest
          --continue

      # One issue, kept open by this workflow and found by the marker on its first line: a new
      # release retitles it, and a new release or a changed result adds a comment, so watchers
      # hear of it. The pull request that moves the pin closes it.
      - name: Open or update the tracking issue
        if: steps.versions.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ steps.versions.outputs.latest }}
          PINNED: ${{ steps.versions.outputs.pinned }}
          CATALOG_PIN: ${{ steps.versions.outputs.catalog-pin }}
          PRETEND: ${{ steps.versions.outputs.pretend }}
          OUTCOME: ${{ steps.build.outcome }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" == success ]]; then
            result=passed
            finding="Against $LATEST, the library builds and its Android host tests pass."
          else
            result=failed
            finding="Against $LATEST, the build or the Android host tests fail: the table below and the run's log show which."
          fi
          table=$(python3 .github/scripts/count-test-results.py \
            "Android host tests against supabase-kt $LATEST" testAndroidHostTest \
            supabase-offline-kt supabase-offline-kt-testing)
          title="supabase-kt $LATEST is available"
          marker="<!-- upstream-canary version=$LATEST result=$result -->"
          checked_on=$(date -u +%Y-%m-%d)
          compatibility_url="$REPOSITORY_URL/blob/main/docs/project/compatibility.md#supabase-kt"
          held_url="$REPOSITORY_URL/blob/main/CONTRIBUTING.md#held-dependencies"

          body_file="$RUNNER_TEMP/upstream-canary-issue.md"
          {
            echo "$marker"
            echo "supabase-kt $LATEST is on Maven Central. This library pins $PINNED (\`supabase-bom\` in \`gradle/libs.versions.toml\`), and $LATEST is newer than that minor."
            echo
            if [[ "$PRETEND" == true ]]; then
              echo "> [!NOTE]"
              echo "> A manual test of this workflow: \`pretend_pinned\` set to $PINNED stood in for the catalog's pin, $CATALOG_PIN."
              echo
            fi
            echo "**$finding**"
            echo
            echo "$table"
            echo
            echo "Checked on $checked_on by [this run]($RUN_URL), at commit $COMMIT. The canary moves the pin in its own checkout and commits nothing. It runs the Android host tests only; the iOS tests run in the pull request that moves the pin."
            echo
            echo "**What to do.** Moving the pin is a decision, not a routine update. Read upstream's release notes for changes to the PostgREST query builder, filters, Storage, and request and retry behavior, and check the Kotlin version it was built with. Then open a pull request that moves \`supabase-bom\` and the pass-through set (Ktor, okio, kotlinx.coroutines, kotlinx.serialization) to the versions $LATEST was built with, adds its row to the [supabase-kt table]($compatibility_url), adds a changelog entry, and closes this issue. See [Held dependencies]($held_url)."
            echo
            echo "<sub>Kept current every Monday by the Upstream canary workflow while supabase-kt has a newer minor than the pin.</sub>"
          } > "$body_file"

          # The label, if it has gone; the Dependabot triage workflow puts it on pull requests.
          labels=$(gh label list --limit 200 --json name --jq '.[].name')
          if ! grep -qx upstream-pin <<< "$labels"; then
            gh label create upstream-pin --color d93f0b \
              --description "supabase-kt or a library it is built against: a newer release, or a pull request moving it"
          fi

          issues=$(gh issue list --label upstream-pin --state open --limit 100 --json number,author,body)
          existing=$(jq -r '[.[] | select(.author.login == "app/github-actions"
            and (.body | startswith("<!-- upstream-canary ")))] | first | .number // empty' <<< "$issues")
          if [[ -z "$existing" ]]; then
            url=$(gh issue create --title "$title" --label upstream-pin --body-file "$body_file")
            echo "Opened $url"
          else
            previous_marker=$(jq -r --argjson number "$existing" \
              '.[] | select(.number == $number) | .body | split("\n") | first | rtrimstr("\r")' <<< "$issues")
            gh issue edit "$existing" --title "$title" --body-file "$body_file" > /dev/null
            url="$REPOSITORY_URL/issues/$existing"
            if [[ "$previous_marker" != "$marker" ]]; then
              gh issue comment "$existing" \
                --body "$finding Checked on $checked_on by [this run]($RUN_URL); the description above is current." > /dev/null
            fi
            echo "Updated $url"
          fi
          echo "Tracking issue: $url ($result)" >> "$GITHUB_STEP_SUMMARY"
