# Dependabot version and security updates. Why some dependencies are held and how their updates
# are reviewed: CONTRIBUTING.md, "Dependency updates". Nothing here merges anything.
#
# Options: https://docs.github.com/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2

updates:
  # Gradle: gradle/libs.versions.toml, the build scripts and the wrapper.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    # A release is proposed once it has been public for a week. supabase-kt is exempt: its patch
    # releases are how upstream crash fixes arrive.
    cooldown:
      default-days: 7
      exclude:
        - "io.github.jan-tennert.supabase*"
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "gradle"
    # The coupled set moves by patch only; a minor or major version is changed by hand. Every
    # coordinate that shares a catalog version key with a held one is listed, so no sibling can
    # move the key. Dependabot applies `update-types` to version updates only, so security
    # updates still arrive.
    ignore:
      - dependency-name: "io.github.jan-tennert.supabase:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # The pass-through set takes no version update at all, patches included: it moves by hand
      # with the supabase-kt pin (CONTRIBUTING.md, "Held dependencies"). Every level is listed:
      # a rule with no `update-types` or `versions` ignores all versions, and `ignore` applies to
      # security updates too (options reference, above), so it would stop those as well.
      - dependency-name: "io.ktor:*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "com.squareup.okio:*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      # Libraries are group:artifact; Gradle plugins are their plugin id. The dot after `kotlin`
      # keeps `org.jetbrains.kotlinx.*` out.
      - dependency-name: "org.jetbrains.kotlin:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "com.android.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "androidx.room:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "androidx.room"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "androidx.sqlite:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # SKIE supports exact Kotlin versions, so it moves by hand, together with Kotlin.
      - dependency-name: "co.touchlab.skie*"
      # The build-tool floors (`buildToolFloor-*` in the catalog) are the patched versions the
      # advisories name, not trackers of the latest release: a floor only ever raises what a plugin
      # brings, so moving it past the advisory buys nothing and can run a plugin on a library
      # version it was never built with. They move by hand when an advisory says so, or through
      # a security update, which these `update-types` rules do not block.
      - dependency-name: "org.bouncycastle:*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.apache.commons:commons-lang3"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.freemarker:freemarker"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.apache.httpcomponents:httpclient"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.jdom:jdom2"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.bitbucket.b_c:jose4j"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "io.opentelemetry:opentelemetry-api"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "com.fasterxml.jackson.*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.jsoup:jsoup"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
    # A dependency joins the first group that matches it. The first three names are the labels the
    # triage workflow applies.
    groups:
      # supabase-kt and the pass-through set; keep it in step with the ignore rules above.
      upstream-pin:
        patterns:
          - "io.github.jan-tennert.supabase*"
          - "io.ktor:*"
          - "com.squareup.okio:*"
          - "org.jetbrains.kotlinx:kotlinx-coroutines*"
          - "org.jetbrains.kotlinx:kotlinx-serialization*"
      toolchain:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.*"
          - "com.android.*"
      persistence:
        patterns:
          - "androidx.room*"
          - "androidx.sqlite*"
      build-tooling:
        patterns:
          - "gradle-wrapper"
          - "com.google.devtools.ksp"
          # Kover's plugin and the library build-logic compiles against share one version.
          - "org.jetbrains.kotlinx.kover"
          - "org.jetbrains.kotlinx:kover-gradle-plugin"
          # The publishing plugin and Dokka, the same way. What they change in the published files
          # shows in scripts/check-published-artifacts.py, which CI runs.
          - "com.vanniktech.maven.publish"
          - "com.vanniktech:gradle-maven-publish-plugin"
          - "org.jetbrains.dokka"
          - "org.jetbrains.dokka:dokka-gradle-plugin"
          # The build-tool floors (`buildToolFloor-*` in the catalog): libraries the plugins bring,
          # raised to patched versions. Keep in step with the catalog.
          - "org.bouncycastle:*"
          - "org.apache.commons:commons-lang3"
          - "org.freemarker:freemarker"
          - "org.apache.httpcomponents:httpclient"
          - "org.jdom:jdom2"
          - "org.bitbucket.b_c:jose4j"
          - "io.opentelemetry:*"
          - "com.fasterxml.jackson.*"
          - "org.jsoup:jsoup"
        update-types: ["minor", "patch"]
      test-libraries:
        patterns:
          - "org.robolectric:*"
          - "androidx.test*"
        update-types: ["minor", "patch"]
      # ktfmt, through the never-used catalog entry that .kempt.toml reads. It arrives alone
      # because the update also needs CI's jar checksum and a `kempt format` run; see
      # CONTRIBUTING.md, "Formatting".
      formatter:
        patterns:
          - "com.facebook:ktfmt"
      # Everything else. A major version matches no group and arrives as its own pull request.
      other-gradle:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions: the workflows and the local composite action. Where a workflow pins an action
  # by commit SHA with the version in a same-line comment, Dependabot updates both.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # The documentation toolchain, .github/workflows/docs-requirements.txt. It is a fully pinned
  # set, so it moves as one pull request.
  - package-ecosystem: "pip"
    directory: "/.github/workflows"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "docs(deps)"
    labels:
      - "dependencies"
      - "docs-toolchain"
    ignore:
      # MkDocs 2 removes the plugin and theme systems Material for MkDocs depends on.
      - dependency-name: "mkdocs"
        versions: [">=2"]
    groups:
      docs-toolchain:
        patterns:
          - "*"
