name: Home directory snapshot
description: >-
  Records the first two levels of the home directory (names, sizes and times, never contents), or
  compares the home directory with that record and fails on any difference. README.md says what it
  watches and what it cannot see.

inputs:
  mode:
    description: "'record' before the job's first step, 'compare' after its clean-up."
    required: true

runs:
  using: composite
  steps:
    - name: Snapshot the home directory
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      # The record is kept beside the runner's work folder, which the snapshot does not watch and
      # the runner does not empty, so a job killed before its comparison leaves it for the next
      # job to report. The script's own temporary files go in the job's temporary folder.
      run: |
        state="$(dirname "$RUNNER_WORKSPACE")/offline-kt-ci-home-snapshot"
        run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
        if [[ "$MODE" == record ]]; then
          bash "$GITHUB_ACTION_PATH/home-snapshot.sh" record "$state" "$RUNNER_TEMP" "$run"
        else
          bash "$GITHUB_ACTION_PATH/home-snapshot.sh" "$MODE" "$state" "$RUNNER_TEMP"
        fi
