name: Set up the build
description: JDK 17 and Gradle, with wrapper validation and the Gradle User Home cache.

inputs:
  gradle-cache:
    description: >-
      'true' to restore setup-gradle's cache (written from main only). 'false' on a machine that
      outlives the job, where the Gradle User Home is the job's own and nothing is restored.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '17'

    # Validates every gradle-wrapper.jar in the repository. The cache is written from main only;
    # other branches read it. `basic` is gradle/actions' open-source (MIT) cache provider; the
    # default provider is proprietary and a time-limited free preview for private repositories.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-provider: basic
        cache-disabled: ${{ inputs.gradle-cache != 'true' }}
