# kempt configuration: https://github.com/ZacSweers/kempt
#
# kempt formats Kotlin and Kotlin script with ktfmt, inserts the licence header and normalises
# whitespace. It does not format Swift.
#
#   kempt check     read-only; what CI's Formatting job runs
#   kempt format    fix every file git tracks
#
# Installing kempt, and what a ktfmt update involves: CONTRIBUTING.md, "Formatting".

[ktfmt]
# Read from gradle/libs.versions.toml ([versions] ktfmt), where Dependabot sees it. CI runs only
# the jar whose checksum it holds, so a ktfmt update changes that checksum too, and needs a
# `kempt format` run on its branch.
version = { file = "gradle/libs.versions.toml", key = "ktfmt" }
# The Kotlin coding conventions: 4-space indent, 100 columns.
style = "kotlinlang"

[license-header]
file = "config/license-header.txt"

[paths]
# The old demo module is not part of the build; formatting it would only add churn. Remove this
# line when the module goes.
exclude = { extend = ["composeApp/**"] }

[whitespace.paths]
# Kotlin and Kotlin script are covered by default. Markdown carries the documentation site.
include = { extend = ["**/*.md", ".gitignore"] }

# [gradle-dependencies-sorter] is deliberately not enabled.
